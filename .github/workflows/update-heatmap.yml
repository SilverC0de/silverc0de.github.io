name: Update heatmap

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate heatmap
        env:
          GH_TOKEN: ${{ secrets.HEATMAP_TOKEN || github.token }}
        run: python .github/scripts/update_heatmap.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add asset/github-contributions.svg index.html
          git commit -m "Update contribution heatmap"
          git push
